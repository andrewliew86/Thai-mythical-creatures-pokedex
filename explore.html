<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#1c7064">
    <title>Explore Thailand | Thai Mythidex</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;700;800&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="explore.css">
  </head>
  <body>
    <main class="world-shell">
      <div id="world" class="world" aria-label="Interactive 3D folklore world"></div>

      <header class="game-header">
        <nav class="game-tabs" aria-label="App views">
          <a href="index.html">Field Guide</a>
          <a class="active" href="explore.html" aria-current="page">3D World</a>
        </nav>
        <button id="reset-button" class="icon-button" type="button" aria-label="Return to the trailhead" title="Return to the trailhead">↻</button>
        <button id="music-button" class="icon-button" type="button" aria-label="Turn music on" title="Turn music on" aria-pressed="false">♫</button>
        <div class="discoveries" aria-live="polite">
          <span>Legends met</span>
          <strong><span id="found-count">0</span> / <span id="total-count">9</span></strong>
        </div>
      </header>

      <section class="region-banner" aria-live="polite">
        <span id="region-kicker">Now exploring</span>
        <strong id="region-name">Central Thailand</strong>
      </section>

      <section class="quest-panel" aria-label="Current objective">
        <span class="quest-mark" aria-hidden="true">✦</span>
        <div>
          <span>Field note</span>
          <strong id="quest-text">Follow the lanterns and meet a local legend.</strong>
        </div>
      </section>

      <button id="meet-button" class="meet-button" type="button" hidden>
        <span aria-hidden="true">✦</span>
        Meet <span id="nearby-name"></span>
      </button>

      <section class="touch-controls" aria-label="Touch movement controls">
        <button type="button" data-move="up" aria-label="Move up">▲</button>
        <button type="button" data-move="left" aria-label="Move left">◀</button>
        <button type="button" data-move="down" aria-label="Move down">▼</button>
        <button type="button" data-move="right" aria-label="Move right">▶</button>
      </section>

      <div id="loading" class="loading-screen" role="status">
        <div class="loading-sun" aria-hidden="true"></div>
        <strong>Growing the folklore world…</strong>
        <span>Planting palms, polishing rivers, waking legends</span>
      </div>

      <dialog id="legend-dialog" class="legend-dialog">
        <button id="close-dialog" class="icon-button close-button" type="button" aria-label="Close legend" title="Close">×</button>
        <div id="legend-content"></div>
      </dialog>

      <div id="error-message" class="error-message" hidden></div>
    </main>

    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.161.0/examples/jsm/"
        }
      }
    </script>
    <script type="module" src="explore.js"></script>
  </body>
</html>
